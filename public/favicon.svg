<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- film reel -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="32" cy="32" r="4.2" fill="#ffffff"/>

  <!-- reel holes -->
  <g fill="#ffffff">
    <circle cx="32" cy="19" r="4.2"/>
    <circle cx="32" cy="45" r="4.2"/>
    <circle cx="19" cy="32" r="4.2"/>
    <circle cx="45" cy="32" r="4.2"/>
    <circle cx="22.8" cy="22.8" r="3.1"/>
    <circle cx="41.2" cy="22.8" r="3.1"/>
    <circle cx="22.8" cy="41.2" r="3.1"/>
    <circle cx="41.2" cy="41.2" r="3.1"/>
  </g>
</svg>
